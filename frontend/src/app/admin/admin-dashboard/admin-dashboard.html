<div class="dashboard">
  <div class="dashboard-header">
    <img src="images/editortoplong.jpg" alt="Decoración superior" />
  </div>

  <div class="dashboard-body">
    <div class="dashboard-inner" [style.backgroundImage]="'url(images/fondolong.jpg)'">
      <main class="dashboard-content">
        <section class="dashboard-panel" aria-labelledby="dashboard-title">
          <h1 class="dashboard-panel__title" id="dashboard-title">Panel de administración</h1>

          <div class="dashboard-sections">
            <article class="dashboard-card">
              <h2>Divinas leyes</h2>

              <nav class="dashboard-card__actions" aria-label="Acciones de divinas leyes">
                <a routerLink="/admin/divinas-leyes">Administrar</a>
                <a routerLink="/admin/divina-ley/nuevo">Nueva divina ley</a>
              </nav>
            </article>

            <article class="dashboard-card">
              <h2>Divinos rollos</h2>

              <nav class="dashboard-card__actions" aria-label="Acciones de divinos rollos">
                <a routerLink="/admin/divinos-rollos">Administrar</a>
                <a routerLink="/admin/divino-rollo/nuevo">Nuevo divino rollo</a>
              </nav>
            </article>

            <article class="dashboard-card">
              <h2>Divinos minirollos</h2>

              <nav class="dashboard-card__actions" aria-label="Acciones de divinos minirollos">
                <a routerLink="/admin/divinos-minirollos">Administrar</a>
                <a routerLink="/admin/divino-minirollo/nuevo">Nuevo divino minirollo</a>
              </nav>
            </article>
          </div>

          <nav class="dashboard-navigation" aria-label="Navegación de administración">
            <a routerLink="/">Volver al sitio</a>
          </nav>
        </section>
      </main>
    </div>
  </div>

  <app-footer></app-footer>
</div>
