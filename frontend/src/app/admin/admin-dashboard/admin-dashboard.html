<div class="dashboard">
  <div class="dashboard-header">
    <img src="images/editortoplong.jpg" alt="Decoración superior" />
  </div>

  <div class="dashboard-body">
    <div class="dashboard-inner" [style.backgroundImage]="'url(images/fondolong.jpg)'">
      <main class="dashboard-content">
        <section class="dashboard-panel" aria-labelledby="dashboard-title">
          <h1 class="dashboard-panel__title" id="dashboard-title">Panel de administración</h1>

          <div class="dashboard-sections">
            <article class="dashboard-card">
              <h2>Divinas leyes</h2>

              <div class="dashboard-card__actions">
                <a class="admin-button" routerLink="/admin/divinas-leyes">Administrar</a>
                <a class="admin-button admin-button--new" routerLink="/admin/divina-ley/nuevo">
                  Nueva divina ley
                </a>
              </div>
            </article>

            <article class="dashboard-card">
              <h2>Divinos rollos</h2>

              <div class="dashboard-card__actions">
                <a class="admin-button" routerLink="/admin/divinos-rollos">Administrar</a>
                <a class="admin-button admin-button--new" routerLink="/admin/divino-rollo/nuevo">
                  Nuevo divino rollo
                </a>
              </div>
            </article>

            <article class="dashboard-card">
              <h2>Divinos minirollos</h2>

              <div class="dashboard-card__actions">
                <a class="admin-button" routerLink="/admin/divinos-minirollos">Administrar</a>
                <a class="admin-button admin-button--new" routerLink="/admin/divino-minirollo/nuevo">
                  Nuevo divino minirollo
                </a>
              </div>
            </article>
          </div>

          <nav class="dashboard-navigation" aria-label="Navegación de administración">
            <a routerLink="/">Volver al sitio</a>
          </nav>
        </section>
      </main>
    </div>
  </div>

  <app-footer></app-footer>
</div>
